<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <link rel="apple-touch-icon" href="logo.png">
        <link rel="icon" href="logo.png">

        <title>Fluid Fix</title>
        <meta name="description" content="A WebGL fluid simulation that works in mobile browsers.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="Fluid Fix">
        <meta property="og:description" content="A WebGL fluid simulation that works in mobile browsers.">

        <script type="text/javascript" src="dat.gui.min.js"></script>
        <style>
            * {
                user-select: none;
            }

            html, body {
                overflow: hidden;
                background-color: #000;
            }

            body {
                margin: 0;
                position: fixed;
                width: 100%;
                height: 100%;
            }

            canvas {
                width: 100%;
                height: 100%;
            }

            .dg {
                opacity: 0.9;
            }

            .dg .property-name {
                overflow: visible;
            }

            .dg.main .close-button {
                border-radius: 0 0 8px 8px;
            }

            /* Toast */

            .toast {
                position: fixed;
                left: 50%;
                top: calc(18px + env(safe-area-inset-top, 0px));
                transform: translate(-50%, -8px);
                z-index: 6;
                max-width: calc(100vw - 32px);
                box-sizing: border-box;
                padding: 8px 16px;
                border-radius: 999px;
                background: rgba(16, 16, 22, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.12);
                -webkit-backdrop-filter: blur(14px);
                backdrop-filter: blur(14px);
                color: #fff;
                font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                letter-spacing: 0.02em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease, transform 0.25s ease;
            }

            .toast.show {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            body.hide-ui .dg.ac {
                opacity: 0;
                pointer-events: none;
            }

            }

        </style>
    </head>
    <body>
        <canvas></canvas>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>


        <script src="./script.js"></script>
    </body>
</html>
